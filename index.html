<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search and explore movie details using the OMDB API. Find titles, directors, genres and more.">
    <title>MovieFinder - OMDB Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- animated background particles -->
    <div id="bg-particles"></div>

    <!-- header -->
    <header id="site-header">
        <div class="header-inner">
            <div class="header-left">
                <h1 id="logo"><span class="logo-icon">&#127916;</span> MovieFinder</h1>
                <p class="tagline">Powered by OMDB API</p>
            </div>
            <div class="header-right">
                <button id="theme-toggle" title="Toggle theme" aria-label="Toggle dark/light mode">
                    <svg id="theme-icon-dark" class="theme-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg id="theme-icon-light" class="theme-svg hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- search section -->
    <section id="search-section">
        <div class="search-box">
            <div class="search-input-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Search for a movie..." autocomplete="off">
                <div id="search-history" class="search-history hidden">
                    <div class="history-header">
                        <span>Recent Searches</span>
                        <button id="clear-history-btn" title="Clear history">&times;</button>
                    </div>
                    <ul id="history-list"></ul>
                </div>
            </div>
            <select id="type-filter">
                <option value="">All Types</option>
                <option value="movie">Movie</option>
                <option value="series">Series</option>
                <option value="episode">Episode</option>
            </select>
            <input type="number" id="year-filter" placeholder="Year" min="1900" max="2099">
            <button id="search-btn">Search</button>
        </div>
    </section>

    <!-- empty state -->
    <div id="empty-state">
        <div class="empty-icon">&#127902;</div>
        <h2>Discover Your Next Favorite Movie</h2>
        <p>Type a movie name above and hit search to explore thousands of titles.</p>
    </div>

    <!-- skeleton loader -->
    <div id="skeleton-loader" class="hidden">
        <div class="skeleton-grid" id="skeleton-grid"></div>
    </div>

    <!-- error / info messages -->
    <div id="message-area" class="hidden"></div>

    <!-- favorites section -->
    <section id="favorites-section" class="hidden">
        <div class="section-header">
            <h2><span class="section-icon">&#9829;</span> My Favorites</h2>
            <button id="toggle-favorites-btn">Show</button>
        </div>
        <div id="favorites-grid" class="hidden"></div>
    </section>

    <!-- search results -->
    <section id="results-section">
        <div id="results-grid"></div>
    </section>

    <!-- pagination -->
    <div id="pagination" class="hidden">
        <button id="prev-btn" disabled>&larr; Prev</button>
        <span id="page-info"></span>
        <button id="next-btn">Next &rarr;</button>
    </div>

    <!-- movie detail modal -->
    <div id="modal-overlay" class="hidden">
        <div id="modal">
            <button id="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- scroll to top -->
    <button id="scroll-top-btn" class="hidden" title="Back to top" aria-label="Scroll to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>

    <footer id="site-footer">
        <p>&copy; 2025 MovieFinder. Data provided by <a href="http://www.omdbapi.com/" target="_blank" rel="noopener">OMDB API</a>.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
